depth_estimation:
  ros__parameters:
    enabled: true
    lazy: true

    topics:
      infra1: /corrected/left/image_raw
      infra2: /corrected/right/image_raw
      depth_viz: /depth_estimation/image_viz
      depth: /depth_estimation/depth

    qos:
      reliable: false
      depth: 2

    stereo:
      processing_scale: 0.5
      num_disparities: 208
      min_disparity: 0
      block_size: 7
      mode: sgbm
      p1_scale: 8
      p2_scale: 32
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
      median_ksize: 3
      sync_slop_sec: 0.02
      pad_left: true
      crop_blank_strip: false

    depth:
      min_m: 0.10
      max_m: 3.0
      colormap: jet
      publish_raw: false

    legend:
      enabled: true
      ticks: 6
      width: 84

    viz:
      width: 848
      height: 480
